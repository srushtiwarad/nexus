# ============================================================
# nexus/docker-compose.yml
# Full local development stack with hot-reload.
# Usage: docker compose up --build
# ============================================================
version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: nexus_app
      POSTGRES_PASSWORD: devpassword123
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus_app -d nexus_db']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (Node.js) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: deps        # use deps stage to get devDeps for nodemon
    container_name: nexus-backend
    restart: unless-stopped
    command: npx nodemon src/server.js
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nexus_db
      DB_USER: nexus_app
      DB_PASSWORD: devpassword123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: dev_access_secret_replace_in_production_64bytes
      JWT_REFRESH_SECRET: dev_refresh_secret_replace_in_production_64bytes
      JWT_ACCESS_TTL: 15m
      ALLOWED_ORIGINS: http://localhost:5173
      AWS_REGION: us-east-1
      S3_BUCKET: nexus-dev-attachments
      LOG_LEVEL: debug
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (Vite) ──────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: nexus-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
      VITE_WS_URL: ws://localhost:3001/ws
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
